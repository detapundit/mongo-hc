aggregator:
  id: mongo-aggregator-01

  server:
    bind_host: 0.0.0.0
    port: 8080

  ai:
    provider: openai
    model: gpt-4.1-mini
    max_tokens: 3000
    temperature: 0.2

  feeds:
    mongo_cve: https://raw.githubusercontent.com/mongodb/docs-assets/master/security/vulnerabilities.json
    osv_api: https://api.osv.dev/v1/query

  trimming:
    drop_fields:
      - raw_metrics
      - logs
      - full_index_details

  mongo:
    latest_major: "7.0"
